name: OEM-preserving FPS policy

on:
  push:
    branches: [zygisk_module, 'feature/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check opt-in default configuration
        run: python3 tests/check_safe_defaults.py
      - name: Compile and run C++ policy tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/oem_policy_test.cpp -o /tmp/oem_policy_test
          /tmp/oem_policy_test
      - name: Probe multiple OEM kernel interface layouts
        run: |
          sh -n packaging/fengchi-probe.sh
          sh tests/test_fengchi_probe.sh
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/fengchi_probe_test.cpp -o /tmp/fengchi_probe_test
          /tmp/fengchi_probe_test
      - name: Verify Unity IL2CPP FPS invocation remains independent of resolution ABI
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/unity_icall_lookup_test.cpp -o /tmp/unity_icall_lookup_test
          /tmp/unity_icall_lookup_test
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/unity_fps_interceptor_test.cpp -o /tmp/unity_fps_interceptor_test
          /tmp/unity_fps_interceptor_test
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic tests/unity_ondemand_runtime_test.cpp -o /tmp/unity_ondemand_runtime_test
          /tmp/unity_ondemand_runtime_test
          python3 tests/check_unity_fps_path.py
      - name: Verify SurfaceFlinger presentation-FPS parser
        run: |
          sh tests/test_sf_latency_parser.sh
