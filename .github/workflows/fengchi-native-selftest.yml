name: Fengchi standalone native self-test (ARM64)

on:
  push:
    branches: [feature/fengchi-direct-native-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ioctl data layout on Linux (host)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 tools/fengchi-direct-selftest/fengchi_selftest.c -o /tmp/fengchi_selftest_host
          /tmp/fengchi_selftest_host --info
          cc -std=c11 -Wall -Wextra -Werror -O2 tools/fengchi-direct-selftest/fengchi_ab.c -o /tmp/fengchi_ab_host
          /tmp/fengchi_ab_host --info
          cc -std=c11 -Wall -Wextra -Werror -O2 tools/fengchi-direct-selftest/fengchi_ed.c -o /tmp/fengchi_ed_host
          /tmp/fengchi_ed_host --info
      - name: Install Android NDK 27
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "ndk;27.2.12479018"
      - name: Compile standalone Bionic ARM64 executable
        run: |
          set -eu
          CLANG="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          mkdir -p out
          "$CLANG" -std=c11 -O2 -Wall -Wextra -Werror -fPIE -pie -Wl,-z,relro,-z,now tools/fengchi-direct-selftest/fengchi_selftest.c -o out/fengchi_selftest_arm64
          "$CLANG" -std=c11 -O2 -Wall -Wextra -Werror -fPIE -pie -Wl,-z,relro,-z,now tools/fengchi-direct-selftest/fengchi_ab.c -o out/fengchi_ab_arm64
          "$CLANG" -std=c11 -O2 -Wall -Wextra -Werror -fPIE -pie -Wl,-z,relro,-z,now tools/fengchi-direct-selftest/fengchi_ed.c -o out/fengchi_ed_arm64
          file out/fengchi_ed_arm64
          file out/fengchi_ab_arm64
          file out/fengchi_selftest_arm64
          readelf -h out/fengchi_selftest_arm64 | grep -E 'Class:|Machine:'
          test -s out/fengchi_selftest_arm64
          test -s out/fengchi_ab_arm64
          test -s out/fengchi_ed_arm64
      - name: Assemble and inspect KernelSU/Magisk flashable module
        run: |
          set -eu
          mkdir -p out/flashable/bin out/dist
          cp -a tools/fengchi-module/. out/flashable/
          cp out/fengchi_ab_arm64 out/flashable/bin/fengchi_ab_arm64
          cp out/fengchi_ed_arm64 out/flashable/bin/fengchi_ed_arm64
          chmod 0755 out/flashable/action.sh out/flashable/bin/fengchi out/flashable/bin/fengchi_ab_arm64 out/flashable/bin/fengchi_ed_arm64
          sh -n out/flashable/action.sh out/flashable/bin/fengchi out/flashable/customize.sh
          test "$(grep '^id=' out/flashable/module.prop)" = "id=fengchi_direct_lab"
          (cd out/flashable && zip -qr9 ../dist/Fengchi_Direct_Lab_v0.3.0-alpha1_arm64.zip .)
          unzip -t out/dist/Fengchi_Direct_Lab_v0.3.0-alpha1_arm64.zip
          unzip -l out/dist/Fengchi_Direct_Lab_v0.3.0-alpha1_arm64.zip
          sha256sum out/dist/Fengchi_Direct_Lab_v0.3.0-alpha1_arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fengchi-selftest-arm64
          path: |
            out/fengchi_selftest_arm64
            out/fengchi_ab_arm64
            out/fengchi_ed_arm64
            out/dist/Fengchi_Direct_Lab_v0.3.0-alpha1_arm64.zip
          if-no-files-found: error
