name: Fengchi standalone native self-test (ARM64)

on:
  push:
    branches: [feature/fengchi-direct-native-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ioctl data layout on Linux (host)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O2 tools/fengchi-direct-selftest/fengchi_selftest.c -o /tmp/fengchi_selftest_host
          /tmp/fengchi_selftest_host --info
      - name: Install Android NDK 27
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "ndk;27.2.12479018"
      - name: Compile standalone Bionic ARM64 executable
        run: |
          set -eu
          CLANG="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang"
          mkdir -p out
          "$CLANG" -std=c11 -O2 -Wall -Wextra -Werror -fPIE -pie -Wl,-z,relro,-z,now tools/fengchi-direct-selftest/fengchi_selftest.c -o out/fengchi_selftest_arm64
          file out/fengchi_selftest_arm64
          readelf -h out/fengchi_selftest_arm64 | grep -E 'Class:|Machine:'
          test -s out/fengchi_selftest_arm64
      - uses: actions/upload-artifact@v4
        with:
          name: fengchi-selftest-arm64
          path: out/fengchi_selftest_arm64
          if-no-files-found: error
